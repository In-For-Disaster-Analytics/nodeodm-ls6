name: Publish shared-submodel runtime
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate versioned runtime
        uses: docker/build-push-action@v6
        with:
          context: ./nodeodx
          file: ./nodeodx/shared-runtime.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/in-for-disaster-analytics/nodeodx:shared-0d8384a6
          cache-from: type=gha,scope=nodeodx-shared
          cache-to: type=gha,mode=max,scope=nodeodx-shared
