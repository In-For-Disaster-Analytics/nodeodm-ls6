name: Build NodeODX pull requests

on:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: ./nodeodx/nodeodx-source
          file: ./nodeodx/nodeodx-source/Dockerfile
          load: true
          tags: ghcr.io/in-for-disaster-analytics/nodeodx:test
          cache-from: type=gha,scope=nodeodx-pr
          cache-to: type=gha,mode=max,scope=nodeodx-pr

      - name: Verify production dependencies and Node runtime
        run: |
          docker run --rm --entrypoint /bin/bash ghcr.io/in-for-disaster-analytics/nodeodx:test -lc '
            . "$NVM_DIR/nvm.sh"
            nvm use "$NODE_VERSION"
            cd /var/www
            command -v npm
            npm --version
            test "$(node -p "process.version")" = "v14.21.3"
            node -e "require.resolve('multer')"
            node -e "console.log(process.execPath)"
          '

      - name: Test powercycle
        run: docker run --rm ghcr.io/in-for-disaster-analytics/nodeodx:test --powercycle
